<!DOCTYPE html>
<html>
<head>
<title>Lab Allocation System</title>

<style>

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0c0f14;
    color: #e4e6eb;
}

/* HEADER */
header {
    padding: 20px;
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    background: #11151c;
    border-bottom: 1px solid #1f242c;
}

/* CONTAINER */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

/* CARD */
.card {
    background: #141a22;
    padding: 18px;
    margin-bottom: 18px;
    border-radius: 12px;
    border: 1px solid #1f242c;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

/* INPUT */
input {
    padding: 10px;
    margin: 6px;
    border-radius: 6px;
    border: 1px solid #2a3038;
    background: #0c0f14;
    color: white;
}

/* BUTTON */
button {
    padding: 10px 16px;
    margin: 6px 4px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    transition: 0.2s;
}

button:hover {
    opacity: 0.85;
}

/* COLORS */
.btn-add { background: #2a3038; color: white; }
.btn-run { background: #1f7a4d; color: white; }
.btn-req { background: #7c5cff; color: white; }

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #2a3038;
}

th {
    background: #1a2028;
    text-align: left;
}

tr:hover {
    background: #1a1f26;
}

/* STATUS */
.green { color: #4ade80; }
.red { color: #f87171; }
.orange { color: #fbbf24; }

</style>
</head>

<body>

<header>💻 Lab Allocation Dashboard</header>

<div class="container">

<div class="card">
<h3>Classes</h3>
<div id="classes">
<input placeholder="Class Name">
<input placeholder="Students">
</div>
<button class="btn-add" onclick="addClass()">+ Add</button>
</div>

<div class="card">
<h3>Time Slots</h3>
<div id="slots">
<input placeholder="9-11">
</div>
<button class="btn-add" onclick="addSlot()">+ Add</button>
</div>

<div class="card">
<h3>Faculty</h3>
<div id="faculties">
<input placeholder="Faculty Name">
</div>
<button class="btn-add" onclick="addFaculty()">+ Add</button>
</div>

<div class="card">
<button class="btn-run" onclick="allocate()">Allocate</button>
<button class="btn-req" onclick="requestComputer()">Request Computer</button>
</div>

<div id="output"></div>

</div>

<script>

let currentLabs = [];

/* ADD INPUTS */
function addClass(){
document.getElementById("classes").innerHTML += 
"<br><input placeholder='Class Name'><input placeholder='Students'>";
}

function addSlot(){
document.getElementById("slots").innerHTML += 
"<br><input placeholder='Time Slot'>";
}

function addFaculty(){
document.getElementById("faculties").innerHTML += 
"<br><input placeholder='Faculty'>";
}

/* LABS */
function generateLabs(){
let labs=[];
for(let f=0;f<5;f++){
for(let i=1;i<=10;i++){
labs.push({name:"B"+f+String(i).padStart(2,'0'),capacity:50});
}}
return labs;
}

/* TIME */
function parseTime(s){
let [a,b]=s.split("-").map(Number);
return [a,b];
}

/* CLASH */
function isAvailable(schedule,slot){
let [s1,e1]=parseTime(slot);
for(let [s2,e2] of schedule){
if(!(e1<=s2 || s1>=e2)) return false;
}
return true;
}

/* ALLOCATE */
function allocate(){

let cInputs=document.querySelectorAll("#classes input");
let sInputs=document.querySelectorAll("#slots input");
let fInputs=document.querySelectorAll("#faculties input");

let classes=[];
for(let i=0;i<cInputs.length;i+=2){
let name=cInputs[i].value;
let students=parseInt(cInputs[i+1].value);
if(name && students) classes.push({name,students});
}

let slots=[...sInputs].map(i=>i.value).filter(v=>v);
let faculties=[...fInputs].map(i=>i.value).filter(v=>v);

classes.sort((a,b)=>b.students-a.students);

let slotMap={};
slots.forEach(s=>slotMap[s]=[]);

classes.forEach((c,i)=>{
let slot=slots[i%slots.length];
slotMap[slot].push(c);
});

let labs=generateLabs();
let facultySchedule={};
faculties.forEach(f=>facultySchedule[f]=[]);

let out="<h3>Allocation Result</h3>";

for(let slot of slots){

out+=`<div class="card"><h4>${slot}</h4>`;
out+=`<table>
<tr><th>Class</th><th>Faculty</th><th>Lab</th><th>Students</th></tr>`;

let availableLabs=labs.map(l=>({...l,used:0}));

for(let c of slotMap[slot]){

let assigned=null;

for(let f of faculties){
if(isAvailable(facultySchedule[f],slot)){
assigned=f;
facultySchedule[f].push(parseTime(slot));
break;
}
}

if(!assigned){
out+=`<tr><td>${c.name}</td><td colspan="3" class="orange">No Faculty</td></tr>`;
continue;
}

let students=c.students;

for(let lab of availableLabs){
if(students<=0) break;

let free=lab.capacity-lab.used;
let assign=Math.min(students,free);

lab.used+=assign;
students-=assign;

if(assign>0){
out+=`<tr>
<td>${c.name}</td>
<td>${assigned}</td>
<td>${lab.name}</td>
<td>${assign}</td>
</tr>`;
}
}

if(students>0){
out+=`<tr><td>${c.name}</td><td colspan="3" class="red">Remaining ${students}</td></tr>`;
}
}

currentLabs=availableLabs;
out+="</table></div>";
}

document.getElementById("output").innerHTML=out;
}

/* REQUEST */
function requestComputer(){

if(currentLabs.length===0){
alert("Run allocation first");
return;
}

for(let lab of currentLabs){
if(lab.used < lab.capacity){
lab.used++;
document.getElementById("output").innerHTML += 
`<p class="green">New Student → ${lab.name}</p>`;
return;
}
}

document.getElementById("output").innerHTML += 
`<p class="red">No space available</p>`;
}

</script>

</body>
</html>
