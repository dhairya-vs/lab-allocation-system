<!DOCTYPE html>
<html>
<head>
<title>Lab Allocation System</title>

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #0ea5e9);
    color: white;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 30px;
}

h2 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 30px;
}

/* GLASS CARD */
.card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border-radius: 15px;
    padding: 20px;
    margin: 20px 0;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

/* INPUT */
input {
    padding: 10px;
    margin: 6px;
    border-radius: 8px;
    border: none;
    outline: none;
    width: 160px;
}

/* BUTTONS */
button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    margin: 8px 5px;
    transition: 0.3s;
}

.primary {
    background: linear-gradient(45deg, #3b82f6, #0ea5e9);
    color: white;
}

.success {
    background: linear-gradient(45deg, #22c55e, #4ade80);
}

button:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

/* OUTPUT CARDS */
.output-card {
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(0,0,0,0.3);
}

.green { border-left: 5px solid #22c55e; }
.orange { border-left: 5px solid orange; }
.red { border-left: 5px solid red; }

</style>
</head>

<body>

<div class="container">

<h2>💻 Lab Allocation System</h2>

<div class="card">
<h3>📘 Classes</h3>
<div id="classes">
<input placeholder="Class Name">
<input placeholder="Students">
</div>
<button class="primary" onclick="addClass()">+ Add Class</button>
</div>

<div class="card">
<h3>⏰ Time Slots</h3>
<div id="slots">
<input placeholder="9-11">
</div>
<button class="primary" onclick="addSlot()">+ Add Slot</button>
</div>

<div class="card">
<h3>👨‍🏫 Faculty</h3>
<div id="faculties">
<input placeholder="Faculty Name">
</div>
<button class="primary" onclick="addFaculty()">+ Add Faculty</button>
</div>

<div class="card">
<button class="success" onclick="allocate()">🚀 Allocate</button>
<button class="primary" onclick="requestComputer()">➕ Request Computer</button>
</div>

<div id="output"></div>

</div>

<script>

let currentLabs = [];

// ADD INPUTS
function addClass() {
document.getElementById("classes").innerHTML += 
"<br><input placeholder='Class Name'><input placeholder='Students'>";
}

function addSlot() {
document.getElementById("slots").innerHTML += 
"<br><input placeholder='Time Slot'>";
}

function addFaculty() {
document.getElementById("faculties").innerHTML += 
"<br><input placeholder='Faculty'>";
}

// LAB GENERATION
function generateLabs() {
let labs = [];
for (let f=0; f<5; f++) {
    for (let i=1;i<=10;i++) {
        labs.push({name:"B"+f+String(i).padStart(2,'0'),capacity:50});
    }
}
return labs;
}

// TIME
function parseTime(slot){
let [s,e]=slot.split("-").map(Number);
return [s,e];
}

// CLASH
function isAvailable(schedule, slot){
let [s1,e1]=parseTime(slot);
for(let [s2,e2] of schedule){
    if(!(e1<=s2 || s1>=e2)) return false;
}
return true;
}

// ALLOCATE
function allocate(){

let classInputs=document.querySelectorAll("#classes input");
let slotInputs=document.querySelectorAll("#slots input");
let facultyInputs=document.querySelectorAll("#faculties input");

let classes=[];
for(let i=0;i<classInputs.length;i+=2){
    let name=classInputs[i].value;
    let students=parseInt(classInputs[i+1].value);
    if(name && students) classes.push({name,students});
}

let slots=Array.from(slotInputs).map(i=>i.value).filter(v=>v);
let faculties=Array.from(facultyInputs).map(i=>i.value).filter(v=>v);

classes.sort((a,b)=>b.students-a.students);

let slotMap={};
slots.forEach(s=>slotMap[s]=[]);

classes.forEach((c,i)=>{
    let slot=slots[i%slots.length];
    slotMap[slot].push(c);
});

let labs=generateLabs();
let facultySchedule={};
faculties.forEach(f=>facultySchedule[f]=[]);

let output="<h2>📊 Allocation Result</h2>";

for(let slot of slots){

output+=`<div class="card"><h3>${slot}</h3>`;
let availableLabs=labs.map(l=>({...l,used:0}));

for(let c of slotMap[slot]){

let assignedFaculty=null;

for(let f of faculties){
    if(isAvailable(facultySchedule[f],slot)){
        assignedFaculty=f;
        facultySchedule[f].push(parseTime(slot));
        break;
    }
}

if(!assignedFaculty){
output+=`<div class="output-card orange">
❌ ${c.name} → No Faculty (Clash)
</div>`;
continue;
}

let students=c.students;

output+=`<div class="output-card green">
<b>${c.name}</b> (👨‍🏫 ${assignedFaculty})<br>`;

for(let lab of availableLabs){
    if(students<=0) break;

    let free=lab.capacity-lab.used;
    let assign=Math.min(students,free);

    lab.used+=assign;
    students-=assign;

    if(assign>0)
    output+=`→ ${lab.name} (${lab.used}/50)<br>`;
}

if(students>0)
output+=`<span class="red">Remaining: ${students}</span>`;

output+="</div>";
}

currentLabs=availableLabs;
output+="</div>";
}

document.getElementById("output").innerHTML=output;
}

// REQUEST
function requestComputer(){

if(currentLabs.length===0){
alert("Run allocation first!");
return;
}

for(let lab of currentLabs){
if(lab.used < lab.capacity){
lab.used++;

document.getElementById("output").innerHTML+=
`<div class="output-card green">
✅ New Student → ${lab.name} (${lab.used}/50)
</div>`;
return;
}
}

document.getElementById("output").innerHTML+=
`<div class="output-card red">
❌ No free computers
</div>`;
}

</script>

</body>
</html>
