<!DOCTYPE html>
<html>
<head>
<title>Lab Allocation System</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0b0f14;
    color: #e6edf3;
}

/* HEADER */
header {
    padding: 20px 30px;
    font-size: 22px;
    font-weight: 600;
    background: #0f141b;
    border-bottom: 1px solid #1f242c;
}

/* LAYOUT */
.wrapper {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    background: #0f141b;
    border-right: 1px solid #1f242c;
    padding: 20px;
}

.sidebar h3 {
    margin-bottom: 10px;
    font-size: 16px;
    color: #9da5b4;
}

/* MAIN */
.main {
    padding: 25px;
    overflow-y: auto;
}

/* CARD */
.card {
    background: #121821;
    padding: 18px;
    border-radius: 10px;
    border: 1px solid #1f242c;
    margin-bottom: 18px;
}

/* INPUT */
input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 6px;
    border: 1px solid #2a3038;
    background: #0b0f14;
    color: white;
}

/* BUTTON */
button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 500;
}

.add { background: #1f242c; color: white; }
.run { background: #16a34a; color: white; }
.req { background: #6d28d9; color: white; }

button:hover {
    opacity: 0.85;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #1f242c;
}

th {
    color: #9da5b4;
    font-weight: 500;
}

tr:hover {
    background: #161c24;
}

/* STATUS */
.green { color: #22c55e; }
.red { color: #ef4444; }
.orange { color: #f59e0b; }

</style>
</head>

<body>

<header>Lab Allocation Dashboard</header>

<div class="wrapper">

<!-- SIDEBAR -->
<div class="sidebar">

<h3>Classes</h3>
<div id="classes">
<input placeholder="Class Name">
<input placeholder="Students">
</div>
<button class="add" onclick="addClass()">Add Class</button>

<h3>Time Slots</h3>
<div id="slots">
<input placeholder="9-11">
</div>
<button class="add" onclick="addSlot()">Add Slot</button>

<h3>Faculty</h3>
<div id="faculties">
<input placeholder="Faculty Name">
</div>
<button class="add" onclick="addFaculty()">Add Faculty</button>

<button class="run" onclick="allocate()">Allocate</button>
<button class="req" onclick="requestComputer()">Request Computer</button>

</div>

<!-- MAIN -->
<div class="main">
<div id="output"></div>
</div>

</div>

<script>

let currentLabs = [];

/* INPUT FUNCTIONS */
function addClass(){
document.getElementById("classes").innerHTML += 
"<input placeholder='Class Name'><input placeholder='Students'>";
}

function addSlot(){
document.getElementById("slots").innerHTML += 
"<input placeholder='Time Slot'>";
}

function addFaculty(){
document.getElementById("faculties").innerHTML += 
"<input placeholder='Faculty'>";
}

/* LABS */
function generateLabs(){
let labs=[];
for(let f=0;f<5;f++){
for(let i=1;i<=10;i++){
labs.push({name:"B"+f+String(i).padStart(2,'0'),capacity:50});
}}
return labs;
}

/* TIME */
function parseTime(s){
let [a,b]=s.split("-").map(Number);
return [a,b];
}

/* CLASH */
function isAvailable(schedule,slot){
let [s1,e1]=parseTime(slot);
for(let [s2,e2] of schedule){
if(!(e1<=s2 || s1>=e2)) return false;
}
return true;
}

/* ALLOCATION */
function allocate(){

let cInputs=document.querySelectorAll("#classes input");
let sInputs=document.querySelectorAll("#slots input");
let fInputs=document.querySelectorAll("#faculties input");

let classes=[];
for(let i=0;i<cInputs.length;i+=2){
let name=cInputs[i].value;
let students=parseInt(cInputs[i+1].value);
if(name && students) classes.push({name,students});
}

let slots=[...sInputs].map(i=>i.value).filter(v=>v);
let faculties=[...fInputs].map(i=>i.value).filter(v=>v);

classes.sort((a,b)=>b.students-a.students);

let slotMap={};
slots.forEach(s=>slotMap[s]=[]);

classes.forEach((c,i)=>{
let slot=slots[i%slots.length];
slotMap[slot].push(c);
});

let labs=generateLabs();
let facultySchedule={};
faculties.forEach(f=>facultySchedule[f]=[]);

let out="<div class='card'><h3>Allocation Result</h3>";

for(let slot of slots){

out+=`<h4>${slot}</h4>`;
out+=`<table>
<tr><th>Class</th><th>Faculty</th><th>Lab</th><th>Students</th></tr>`;

let availableLabs=labs.map(l=>({...l,used:0}));

for(let c of slotMap[slot]){

let assigned=null;

for(let f of faculties){
if(isAvailable(facultySchedule[f],slot)){
assigned=f;
facultySchedule[f].push(parseTime(slot));
break;
}
}

if(!assigned){
out+=`<tr><td>${c.name}</td><td colspan="3" class="orange">No Faculty</td></tr>`;
continue;
}

let students=c.students;

for(let lab of availableLabs){
if(students<=0) break;

let free=lab.capacity-lab.used;
let assign=Math.min(students,free);

lab.used+=assign;
students-=assign;

if(assign>0){
out+=`<tr>
<td>${c.name}</td>
<td>${assigned}</td>
<td>${lab.name}</td>
<td>${assign}</td>
</tr>`;
}
}

if(students>0){
out+=`<tr><td>${c.name}</td><td colspan="3" class="red">Remaining ${students}</td></tr>`;
}
}

currentLabs=availableLabs;
out+="</table>";
}

out+="</div>";

document.getElementById("output").innerHTML=out;
}

/* REQUEST */
function requestComputer(){

if(currentLabs.length===0){
alert("Run allocation first");
return;
}

for(let lab of currentLabs){
if(lab.used < lab.capacity){
lab.used++;
document.getElementById("output").innerHTML += 
`<p class="green">New Student → ${lab.name}</p>`;
return;
}
}

document.getElementById("output").innerHTML += 
`<p class="red">No space available</p>`;
}

</script>

</body>
</html>
