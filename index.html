<!DOCTYPE html>
<html>
<head>
<title>Lab Allocation System</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0e1116;
    color: #e6edf3;
}

/* HEADER */
header {
    text-align: center;
    padding: 20px;
    font-size: 24px;
    font-weight: 600;
    border-bottom: 1px solid #1f2937;
}

/* CONTAINER */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.full {
    grid-column: span 2;
}

/* CARD */
.card {
    background: #151a22;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid #222938;
}

/* INPUT */
input {
    width: 95%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 6px;
    border: 1px solid #2c3445;
    background: #0e1116;
    color: white;
}

/* BUTTON */
button {
    padding: 10px 16px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 500;
}

.add { background: #2c3445; color: white; }
.run { background: #16a34a; color: white; }
.req { background: #14b8a6; color: white; }

button:hover {
    opacity: 0.85;
}

/* RESULT BOX */
.result {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: #0b0f14;
}

/* STATUS */
.green { color: #22c55e; }
.red { color: #ef4444; }
.orange { color: #f59e0b; }

</style>
</head>

<body>

<header>Lab Allocation System</header>

<div class="container">

<div class="card">
<h3>Classes</h3>
<div id="classes">
<input placeholder="Class Name">
<input placeholder="Students">
</div>
<button class="add" onclick="addClass()">+ Add</button>
</div>

<div class="card">
<h3>Time Slots</h3>
<div id="slots">
<input placeholder="9-11">
</div>
<button class="add" onclick="addSlot()">+ Add</button>
</div>

<div class="card full">
<h3>Faculty</h3>
<div id="faculties">
<input placeholder="Faculty Name">
</div>
<button class="add" onclick="addFaculty()">+ Add</button>
</div>

<div class="card full">
<button class="run" onclick="allocate()">Allocate</button>
<button class="req" onclick="requestComputer()">Request Computer</button>
</div>

<div class="card full">
<h3>Allocation Result</h3>
<div id="output"></div>
</div>

</div>

<script>

let currentLabs = [];

function addClass(){
document.getElementById("classes").innerHTML += 
"<br><input placeholder='Class Name'><input placeholder='Students'>";
}

function addSlot(){
document.getElementById("slots").innerHTML += 
"<br><input placeholder='Time Slot'>";
}

function addFaculty(){
document.getElementById("faculties").innerHTML += 
"<br><input placeholder='Faculty'>";
}

function generateLabs(){
let labs=[];
for(let f=0;f<5;f++){
for(let i=1;i<=10;i++){
labs.push({name:"B"+f+String(i).padStart(2,'0'),capacity:50});
}}
return labs;
}

function parseTime(s){
let [a,b]=s.split("-").map(Number);
return [a,b];
}

function isAvailable(schedule,slot){
let [s1,e1]=parseTime(slot);
for(let [s2,e2] of schedule){
if(!(e1<=s2 || s1>=e2)) return false;
}
return true;
}

function allocate(){

let cInputs=document.querySelectorAll("#classes input");
let sInputs=document.querySelectorAll("#slots input");
let fInputs=document.querySelectorAll("#faculties input");

let classes=[];
for(let i=0;i<cInputs.length;i+=2){
let name=cInputs[i].value;
let students=parseInt(cInputs[i+1].value);
if(name && students) classes.push({name,students});
}

let slots=[...sInputs].map(i=>i.value).filter(v=>v);
let faculties=[...fInputs].map(i=>i.value).filter(v=>v);

classes.sort((a,b)=>b.students-a.students);

let slotMap={};
slots.forEach(s=>slotMap[s]=[]);

classes.forEach((c,i)=>{
let slot=slots[i%slots.length];
slotMap[slot].push(c);
});

let labs=generateLabs();
let facultySchedule={};
faculties.forEach(f=>facultySchedule[f]=[]);

let out="";

for(let slot of slots){

out+=`<div class="result"><b>${slot}</b><br>`;
let availableLabs=labs.map(l=>({...l,used:0}));

for(let c of slotMap[slot]){

let assigned=null;

for(let f of faculties){
if(isAvailable(facultySchedule[f],slot)){
assigned=f;
facultySchedule[f].push(parseTime(slot));
break;
}
}

if(!assigned){
out+=`<div class="orange">${c.name} → No Faculty</div>`;
continue;
}

let students=c.students;

out+=`<div><b>${c.name}</b> (${assigned})<br>`;

for(let lab of availableLabs){
if(students<=0) break;

let free=lab.capacity-lab.used;
let assign=Math.min(students,free);

lab.used+=assign;
students-=assign;

if(assign>0)
out+=`${lab.name} → ${lab.used}/50<br>`;
}

if(students>0)
out+=`<span class="red">Remaining ${students}</span>`;

out+="</div>";
}

currentLabs=availableLabs;
out+="</div>";
}

document.getElementById("output").innerHTML=out;
}

function requestComputer(){

if(currentLabs.length===0){
alert("Run allocation first");
return;
}

for(let lab of currentLabs){
if(lab.used < lab.capacity){
lab.used++;
document.getElementById("output").innerHTML += 
`<div class="green">New Student → ${lab.name}</div>`;
return;
}
}

document.getElementById("output").innerHTML += 
`<div class="red">No space available</div>`;
}

</script>

</body>
</html>
