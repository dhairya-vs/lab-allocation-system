<!DOCTYPE html>
<html>
<head>
<title>Lab Allocation System</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #5f6fff, #7b5cff, #9b59b6);
    color: white;
}

/* HEADER */
header {
    text-align: center;
    padding: 25px;
    font-size: 28px;
    font-weight: 600;
}

/* GRID */
.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 20px;
    max-width: 1100px;
    margin: auto;
}

/* FULL WIDTH CARD */
.full {
    grid-column: span 2;
}

/* CARD */
.card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

/* INPUT */
input {
    width: 90%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
    outline: none;
}

/* BUTTON */
button {
    padding: 10px 18px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    background: #00c2ff;
    color: white;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

/* RESULT */
.result {
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(0,0,0,0.2);
}

.green { color: #00ff9d; }
.red { color: #ff6b6b; }
.orange { color: #ffd166; }

</style>
</head>

<body>

<header>💻 Lab Allocation System</header>

<div class="container">

<!-- CLASSES -->
<div class="card">
<h3>Add Classes</h3>
<div id="classes">
<input placeholder="Class Name">
<input placeholder="Students">
</div>
<button onclick="addClass()">+ Add Class</button>
</div>

<!-- SLOTS -->
<div class="card">
<h3>Time Slots</h3>
<div id="slots">
<input placeholder="9-11">
</div>
<button onclick="addSlot()">+ Add Slot</button>
</div>

<!-- FACULTY -->
<div class="card full">
<h3>Faculty</h3>
<div id="faculties">
<input placeholder="Faculty Name">
</div>
<button onclick="addFaculty()">+ Add Faculty</button>
</div>

<!-- ACTION -->
<div class="card full">
<button onclick="allocate()">🚀 Allocate</button>
<button onclick="requestComputer()">➕ Request Computer</button>
</div>

<!-- OUTPUT -->
<div class="card full">
<h3>Allocation Result</h3>
<div id="output"></div>
</div>

</div>

<script>

let currentLabs = [];

/* ADD INPUTS */
function addClass(){
document.getElementById("classes").innerHTML += 
"<br><input placeholder='Class Name'><input placeholder='Students'>";
}

function addSlot(){
document.getElementById("slots").innerHTML += 
"<br><input placeholder='Time Slot'>";
}

function addFaculty(){
document.getElementById("faculties").innerHTML += 
"<br><input placeholder='Faculty'>";
}

/* LABS */
function generateLabs(){
let labs=[];
for(let f=0;f<5;f++){
for(let i=1;i<=10;i++){
labs.push({name:"B"+f+String(i).padStart(2,'0'),capacity:50});
}}
return labs;
}

/* TIME */
function parseTime(s){
let [a,b]=s.split("-").map(Number);
return [a,b];
}

/* CLASH */
function isAvailable(schedule,slot){
let [s1,e1]=parseTime(slot);
for(let [s2,e2] of schedule){
if(!(e1<=s2 || s1>=e2)) return false;
}
return true;
}

/* ALLOCATE */
function allocate(){

let cInputs=document.querySelectorAll("#classes input");
let sInputs=document.querySelectorAll("#slots input");
let fInputs=document.querySelectorAll("#faculties input");

let classes=[];
for(let i=0;i<cInputs.length;i+=2){
let name=cInputs[i].value;
let students=parseInt(cInputs[i+1].value);
if(name && students) classes.push({name,students});
}

let slots=[...sInputs].map(i=>i.value).filter(v=>v);
let faculties=[...fInputs].map(i=>i.value).filter(v=>v);

classes.sort((a,b)=>b.students-a.students);

let slotMap={};
slots.forEach(s=>slotMap[s]=[]);

classes.forEach((c,i)=>{
let slot=slots[i%slots.length];
slotMap[slot].push(c);
});

let labs=generateLabs();
let facultySchedule={};
faculties.forEach(f=>facultySchedule[f]=[]);

let out="";

for(let slot of slots){

out+=`<div class="result"><b>${slot}</b><br>`;
let availableLabs=labs.map(l=>({...l,used:0}));

for(let c of slotMap[slot]){

let assigned=null;

for(let f of faculties){
if(isAvailable(facultySchedule[f],slot)){
assigned=f;
facultySchedule[f].push(parseTime(slot));
break;
}
}

if(!assigned){
out+=`<div class="orange">${c.name} → No Faculty</div>`;
continue;
}

let students=c.students;

out+=`<div><b>${c.name}</b> (${assigned})<br>`;

for(let lab of availableLabs){
if(students<=0) break;

let free=lab.capacity-lab.used;
let assign=Math.min(students,free);

lab.used+=assign;
students-=assign;

if(assign>0)
out+=`${lab.name} → ${lab.used}/50<br>`;
}

if(students>0)
out+=`<span class="red">Remaining ${students}</span>`;

out+="</div>";
}

currentLabs=availableLabs;
out+="</div>";
}

document.getElementById("output").innerHTML=out;
}

/* REQUEST */
function requestComputer(){

if(currentLabs.length===0){
alert("Run allocation first");
return;
}

for(let lab of currentLabs){
if(lab.used < lab.capacity){
lab.used++;
document.getElementById("output").innerHTML += 
`<div class="green">New Student → ${lab.name}</div>`;
return;
}
}

document.getElementById("output").innerHTML += 
`<div class="red">No space available</div>`;
}

</script>

</body>
</html>
